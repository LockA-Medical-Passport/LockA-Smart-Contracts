name: ZK Credential Verifier CI

on:
  push:
    branches: [main]
    paths:
      - 'zk-credential-verifier/**'
      - '.github/workflows/zk-credential-verifier.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: [main]
    paths:
      - 'zk-credential-verifier/**'
      - '.github/workflows/zk-credential-verifier.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'

concurrency:
  group: zk-verifier-ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.84.0"

jobs:
  lint:
    name: Lint & Format (zk-credential-verifier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: zk-verifier-lint-${{ hashFiles('**/Cargo.lock') }}
      - name: Check formatting
        run: cargo fmt --package zk-credential-verifier -- --check
      - name: Clippy (Protocol 25 & hazmat-crypto enabled)
        run: cargo clippy --package zk-credential-verifier --all-targets --all-features -- -D warnings

  test:
    name: Test (zk-credential-verifier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: zk-verifier-test-${{ hashFiles('**/Cargo.lock') }}
      - name: Run unit and BN254 host-function tests
        run: cargo test --package zk-credential-verifier --all-features --verbose

  build-wasm:
    name: Build WASM (zk-credential-verifier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          key: zk-verifier-wasm-${{ hashFiles('**/Cargo.lock') }}
      - name: Build contract for wasm32v1-none
        run: cargo build --package zk-credential-verifier --release --target wasm32v1-none
      - name: Report contract wasm size
        run: ls -lh target/wasm32v1-none/release/zk_credential_verifier.wasm || ls -lh target/wasm32v1-none/release/*.wasm
